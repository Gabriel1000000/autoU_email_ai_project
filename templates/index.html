<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoU - Classificador de Emails</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="/">AutoU - Classificador de Emails</a>
      </div>
    </nav>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-9">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Envie um e-mail (.txt ou .pdf) ou cole o texto</h5>
              <form method="post" action="/process" enctype="multipart/form-data">
                <div class="mb-3">
                  <label for="email_file" class="form-label">Upload de arquivo</label>
                  <input class="form-control" type="file" id="email_file" name="email_file" accept=".txt,.pdf">
                </div>
                <div class="mb-3">
                  <label for="email_text" class="form-label">Ou cole o texto do e-mail</label>
                  <textarea class="form-control" id="email_text" name="email_text" rows="6" placeholder="Cole aqui o conteúdo do e-mail..."></textarea>
                </div>
                <button class="btn btn-primary" type="submit">Processar</button>
                <a class="btn btn-outline-secondary" href="#" onclick="fillSamples();return false;">Exemplos</a>
              </form>
              
            </div>
          </div>
          <footer class="mt-3 text-center text-muted small">Projeto entregue como prova de conceito.</footer>
        </div>
      </div>
    </main>

    <script src="{{ url_for('static', filename='js/index.js') }}"></script>

  </body>
</html>
